<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071225">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Torque Campo · CWA 12</title>
<link rel="manifest" href="campo.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#071225;--bg2:#0A1830;--panel:#0E1E3A;--panel2:#12264A;--line:#1E3560;--line2:#28457A;--ink:#E8EEF8;--muted:#8FA3C4;--dim:#6B7FA3;
--acc:#2F80FF;--acc2:#5AA0FF;--accbg:rgba(47,128,255,.14);--ok:#22C55E;--okbg:rgba(34,197,94,.14);--pend:#F5B342;--pendbg:rgba(245,179,66,.14);--bad:#F05252;--badbg:rgba(240,82,82,.15);--man:#A78BFA;--manbg:rgba(167,139,250,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0A1830,#071225);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2F80FF,#1B4FB8);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;color:#fff}
.ttl{flex:1;min-width:0}.ttl b{display:block;font-size:16px}.ttl span{font-size:12px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--pend)}.dot.err{background:var(--bad)}
.wrap{padding:12px 14px 120px;max-width:720px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bar{flex:1;height:8px;border-radius:6px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2F80FF,#22C55E)}
.prog .n{font-size:13px;color:var(--muted);white-space:nowrap}.prog .n b{color:var(--ink)}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;padding:13px 14px 13px 42px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);font-size:16px;outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
select,input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
select:focus,input:focus,textarea:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--line2);background:var(--panel);font-size:13px;white-space:nowrap}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc2);font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.it:active{background:var(--panel2)}
.st{width:10px;align-self:stretch;border-radius:6px;background:var(--pend);flex:none}.st.ok{background:var(--ok)}.st.man{background:var(--man)}
.it .m{flex:1;min-width:0}.it .t{font-weight:700;font-size:15px;word-break:break-word}.it .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.it .q{text-align:right;font-size:12px;color:var(--muted);flex:none}.it .q b{display:block;font-size:18px;color:var(--ink)}
.more{margin-top:10px;width:100%;padding:12px;border-radius:12px;border:1px dashed var(--line2);background:none;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.pend{background:var(--pendbg);color:var(--pend)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.man{background:var(--manbg);color:var(--man)}
/* folha da junta */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg2);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;max-height:94vh;overflow:auto;transform:translateY(105%);transition:transform .25s;padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:4px;background:var(--line2);margin:4px auto 12px}
.hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}.hd h2{margin:0;font-size:19px;flex:1;word-break:break-word}
.x{border:0;background:var(--panel);width:36px;height:36px;border-radius:50%;font-size:20px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:6px 0 12px}.kv div:nth-child(odd){color:var(--muted)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.big div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.big span{font-size:12px;color:var(--muted);display:block}.big b{font-size:18px}
.f{display:block;margin-bottom:10px}.f>span{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px 2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.note.warn{border-color:rgba(245,179,66,.5);background:var(--pendbg)}.note.bad{border-color:rgba(240,82,82,.5);background:var(--badbg)}.note.man{border-color:rgba(167,139,250,.5);background:var(--manbg)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);font-weight:700;font-size:16px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ok{background:#16A34A;border-color:#16A34A;color:#fff}
.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg button{padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-weight:700}
.seg button.on.okk{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.seg button.on.nok{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.done{text-align:center;padding:8px 0 4px}.done svg{width:64px;height:64px;color:var(--ok)}.done h3{margin:6px 0 4px;font-size:20px}.done p{margin:0;color:var(--muted);font-size:14px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.login h1{font-size:24px;margin:16px 0 4px}.login p{color:var(--muted);margin:0 0 20px}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:#0B1B36;border:1px solid var(--line2);padding:12px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;max-width:90vw;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.menu{position:absolute;right:12px;top:60px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:6px;min-width:220px;display:none;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.menu.on{display:block}.menu button{display:block;width:100%;text-align:left;padding:12px;border:0;background:none;border-radius:10px}.menu button:active{background:var(--panel2)}
.menu .who{padding:10px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px}
.demo{background:var(--pendbg);color:var(--pend);font-size:12.5px;text-align:center;padding:6px 10px;border-bottom:1px solid rgba(245,179,66,.3)}
.hide{display:none!important}
</style>
</head>

   <div class="note">${fmt(mine.length)} junta(s) · ${fmt(mine.reduce((a,[j])=>a+(j.qtd||0),0))} parafusos</div>
   <div class="list">${mine.map(([j,v])=>`<button class="it" data-i="${j.item}"><i class="st ok"></i><div class="m"><div class="t">${esc(j.peca)} / ${esc(j.lig)}</div><div class="s">El. ${esc(j.elev)} · Fila ${esc(j.fila)} · Eixo ${esc(j.eixo)}${v.tq!=null?' · '+esc(v.tq)+' N·m':''}</div></div><div class="q"><b>${j.qtd??'—'}</b>paraf.</div></button>`).join('')||'<div class="empty">Nenhuma ainda.</div>'}</div>`;
  $('#sx').onclick=closeSheet; document.querySelectorAll('#sheet .it').forEach(b=>b.onclick=()=>openJ(+b.dataset.i));
  $('#sheet').classList.add('on'); $('#sbg').classList.add('on');
}

// ---------------- nuvem ----------------
let started=false;
CLOUD.init({
  onUser:u=>{ if(!u){ started=false; renderLogin(); return; } if(!u.nome){ renderNome(); return; } if(!started){ started=true; renderMain(); } },
  onBaixas:map=>{ INSP={}; Object.entries(map).forEach(([k,v])=>INSP[+k]=v); if(started){ renderList(); if(cur) renderJ(); } updStatus(); },
  onTm:l=>{ if(Array.isArray(l)&&l.length) TM=l.map(t=>({n:t.n,emin:t.emin,emax:t.emax,cal:t.cal,val:t.val,cert:t.cert,emp:t.emp||'LOCMAIS'})); },
  onStatus:e=>{ if(e) toast(e); updStatus(); }
});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw-campo.js').catch(()=>{});
</script>
